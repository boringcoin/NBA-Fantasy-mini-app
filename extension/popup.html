<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Thunder Fantasy</title><style>body{width:320px;padding:18px;margin:0;background:#0b1626;color:#edf3fa;font:14px/1.6 -apple-system,'Segoe UI',sans-serif}h1{font-size:19px;margin:0 0 6px}p{color:#b6c5d7}input{box-sizing:border-box;width:100%;background:#17273c;color:white;border:1px solid #65768c;border-radius:8px;padding:10px;font:22px monospace;letter-spacing:.2em}button{cursor:pointer;border:1px solid #536781;border-radius:8px;padding:9px 12px;background:#243e5c;color:white;margin-top:10px;width:100%;font:inherit}.primary{background:#dd7a30;color:#101d2d;border:0;font-weight:700}.small{font-size:12px}#status,#current-team{white-space:pre-wrap;overflow-wrap:anywhere}button:disabled{opacity:.5}[hidden]{display:none!important}</style></head><body><h1>ϟ Thunder Fantasy</h1><div id="status">正在连接本机应用…</div><section id="pair"><p>在桌面应用“设置与配对”生成六位配对码。</p><input id="code" maxlength="6" inputmode="numeric" autocomplete="off" placeholder="六位配对码"><button class="primary" id="connect">连接自己的桌面应用</button></section><section id="connected" hidden><p id="leagues"></p><button class="primary" id="reload-pages" hidden>扩展已更新 · 刷新 Yahoo 页面</button><div style="border:1px solid #536781;border-radius:8px;padding:10px"><b>从当前网页添加球队</b><p class="small" id="current-team">正在识别当前球队…</p><button class="primary" id="import-team" disabled>导入当前球队</button><p class="small">请确认打开的是自己的 My Team。其他联盟可用同样方式逐个导入。</p></div><button class="primary" id="refresh">立即同步球员与全盟数据</button><button id="open">打开我的 Yahoo 球队</button><button id="disconnect">解除此浏览器配对</button></section><p class="small">自动同步每 10 分钟一次，更新当日出场球员和本周全盟战力。请保持桌面应用运行，并打开一个已配置的 Yahoo 联盟标签页。</p><script src="popup.js"></script></body></html>
