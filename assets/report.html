ow-wrap:anywhere}.bar-track{height:12px;background:var(--panel);border-radius:20px;overflow:hidden}.bar-fill{display:block;height:100%;background:#3c7fb6;border-radius:20px}.bar-score{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}

inset 0 0 0 2px #5783ac}.matrix .self{color:var(--muted);padding:14px}.matrix th:first-child{min-width:220px}.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}.swatch{display:inline-block;width:11px;height:11px;border:1px solid #15263d20;border-radius:3px;margin-right:5px}.win-bg{background:#dff1e7}.loss-bg{background:#f8e1e4}.tie-bg{background:#eef1f5}.rank-tag{font-size:11px;color:var(--muted);margin-left:6px}.footer{margin-top:24px;border-top:1px solid var(--line);padding-top:16px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:20px}.link-btn{padding:0;border:0;background:none;color:var(--accent);font-size:12px}dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);max-width:1050px;width:calc(100% - 32px);padding:24px;max-height:88vh;box-shadow:0 20px 100px #0005}dialog::backdrop{background:#0712219c;backdrop-filter:blur(3px)}.dialog-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px}.dialog-title{font-size:20px;margin:0 0 5px}.dialog-score{font-size:26px;font-weight:750;letter-spacing:.03em;color:var(--accent);margin:12px 0}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.detail-grid>div{border:1px solid var(--line);border-radius:10px;padding:14px}.detail-grid p{margin:3px 0;font-size:13px}.rules p{margin:10px 0}.a11y-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:950px){.shell{padding:24px 16px}.grid{grid-template-columns:1fr}.top{flex-direction:column}.league-switch{width:100%}.league-switch button{flex:1;padding:9px 12px}.nav button{padding:10px 12px}.panel{padding:18px}.detail-grid{grid-template-columns:1fr}.footer{flex-direction:column;gap:8px}}

@media(max-width:950px){.header-controls{width:100%;align-items:stretch}.appearance{justify-content:flex-start}}

<body>
<main class="shell">
 <header class="top"><div><div class="eyebrow">FANTASY / WEEKLY REVIEW</div><h1 id="title">范特西全盟周报</h1><p class="meta" id="meta"></p></div><div class="header-controls"><div class="league-switch" id="leagues" aria-label="选择联盟"></div><div class="appearance"><label for="weeks">统计周次</label><select class="field" id="weeks" aria-label="选择统计周次"></select><label for="appearance">背景主题</label><select class="field" id="appearance"><option value="default">跟随联盟默认</option><option value="white">白色</option><option value="dark">深色</option><option value="gray">浅灰</option><option value="warm">暖米色</option><option value="custom">自选颜色</option></select><label class="color-picker" id="color-control" hidden>背景色<input id="bg-color" type="color" value="#ffffff" aria-label="选择自定义背景色"></label><span id="theme-status" class="theme-status" role="status"></span></div></div></header>
 <div class="chips" id="chips"></div>
 <nav class="nav" id="nav" aria-label="查看内容"></nav>
 <div class="toolbar"><div><h2 id="view-title"></h2><span class="note" id="view-note"></span></div><div class="tools"><label class="a11y-only" for="search">搜索球队</label><input id="search" class="field" placeholder="搜索球队名称" type="search"><label class="check" id="ranks-control"><input type="checkbox" id="ranks" checked>显示盟内排名</label><select id="matrix-sort" class="field" aria-label="矩阵排序"><option value="power">按战力积分</option><option value="allplay">按全对战胜场</option><option value="name">按球队名称</option><option value="gp">按 GP</option></select><button class="btn small" id="reset">重置排序</button><button class="btn small" id="csv">导出 CSV</button></div></div>
 <section id="content" aria-live="polite"></section>
 <footer class="footer"><span>本地离线周报 · 内含全部数据，无需联网或安装软件。数据为导出时快照，后续技术统计修正以 Yahoo 为准。</span><button class="link-btn" id="rules">计算规则与数据来源</button></footer>
</main>
<dialog id="detail" aria-labelledby="dialog-title"><div class="dialog-top"><div><h2 class="dialog-title" id="dialog-title"></h2><div class="note" id="dialog-note"></div></div><button class="btn small" id="close-dialog">关闭 ✕</button></div><div id="dialog-content"></div></dialog>
<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>
'use strict';
const REPORT=JSON.parse(document.getElementById('report-data').textContent);
const VIEWS=[['overview','全盟排名'],['stats','球队数据'],['actual','实际对局'],['matrix','全员对战'],['luck','走位与险胜']];
const LABEL={'FG%':'投篮命中率','FT%':'罚球命中率','3PTM':'三分','PTS':'得分','OREB':'前场篮板','REB':'总篮板','AST':'助攻','ST':'抢断','BLK':'盖帽','TO':'失误 ↓','A/T':'助失比'};
const THEME_KEY='fantasy-weekly-report-appearance-v1';
const PALETTES={
 white:{bg:'#ffffff',panel:'#f4f6f9',surface:'#ffffff',ink:'#182a40',muted:'#586b81',line:'#dae2ec',accent:'#b85510',hover:'#edf2f7'},
 dark:{bg:'#091321',panel:'#142034',surface:'#101b2c',ink:'#e8edf5',muted:'#a5b4c7',line:'#2b3a50',accent:'#ffac65',hover:'#1d2d44'},
 gray:{bg:'#eef2f6',panel:'#e4eaf1',surface:'#ffffff',ink:'#182a40',muted:'#52657b',line:'#cbd6e2',accent:'#a84c0b',hover:'#e2eaf3'},
 warm:{bg:'#fbf5e9',panel:'#f3eadb',surface:'#fffdf8',ink:'#332b23',muted:'#695c4e',line:'#d7cab8',accent:'#94500f',hover:'#f0e7d7'}
};
const preferences=(()=>{try{const p=JSON.parse(localStorage.getItem(THEME_KEY)||'{}');return p&&typeof p==='object'&&!Array.isArray(p)?p:{}}catch{return {}}})();
function luminance(hex){const v=hex.match(/[a-f0-9]{2}/ig).map(x=>parseInt(x,16)/255).map(x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4);return .2126*v[0]+.7152*v[1]+.0722*v[2]}
function mix(hex,other,amount){const a=hex.match(/[a-f0-9]{2}/ig),b=other.match(/[a-f0-9]{2}/ig);return '#'+a.map((x,i)=>Math.round(parseInt(x,16)*(1-amount)+parseInt(b[i],16)*amount).toString(16).padStart(2,'0')).join('')}
function appearancePreference(){const p=preferences[state.league]||{},theme=['default','white','dark','gray','warm','custom'].includes(p.theme)?p.theme:'default';return {theme,color:/^#[a-f0-9]{6}$/i.test(p.color||'')?p.color:(dataset().theme==='dark'?'#091321':'#ffffff')}}
function applyTheme(){const pref=appearancePreference(),resolved=pref.theme==='default'?(dataset().theme||'white'):pref.theme;let palette=PALETTES[resolved],dark=resolved==='dark';
 if(resolved==='custom'){const l=luminance(pref.color);dark=1.05/(l+.05)>(l+.05)/.05;const ink=dark?'#ffffff':'#000000',away=dark?'#000000':'#ffffff';palette={bg:pref.color,surface:mix(pref.color,away,.15),panel:mix(pref.color,away,.25),ink,muted:ink,line:mix(pref.color,ink,.30),accent:ink,hover:mix(pref.color,away,.30)};}
 document.body.classList.toggle('dark',dark);document.body.classList.toggle('custom-theme',resolved==='custom');
 for(const [key,value]of Object.entries(palette))document.body.style.setProperty('--'+key,value);
 $('appearance').value=pref.theme;$('bg-color').value=pref.color;$('color-control').hidden=resolved!=='custom';
}
function saveAppearance(theme,color){preferences[state.league]={theme,color};let saved=true;try{localStorage.setItem(THEME_KEY,JSON.stringify(preferences))}catch{saved=false}applyTheme();$('theme-status').textContent=saved?'已记住此联盟的选择':'仅本次生效（浏览器未允许保存）'}
const initial=REPORT.leagues.find(d=>d.snapshot.leagueID===REPORT.selection?.leagueID&&(!REPORT.selection.week||d.snapshot.week===REPORT.selection.week))||REPORT.leagues[0];
const state={league:initial.snapshot.leagueID,week:initial.snapshot.week,view:'overview',sort:'rank',direction:1,query:'',ranks:true,matrixSort:'power'};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let csvRows=[];
function dataset(){return REPORT.leagues.find(x=>x.snapshot.leagueID===state.league&&x.snapshot.week===state.week)}
function context(){const {snapshot:s,analysis:a}=dataset();return {s,a,teams:Object.fromEntries(s.leaguePower.teams.map(t=>[t.id,t])),rows:Object.fromEntries(a.rows.map(r=>[r.id,r])),luck:Object.fromEntries(a.luck.map(r=>[r.id,r]))}}
function value(t,key){const st=t.stats;let n;
 if(key==='FG%'||key==='FT%'){const pair=(st[key==='FG%'?'FGM/A':'FTM/A']||'').split('/').map(Number);if(pair.length===2)return pair[1]>0?pair[0]/pair[1]:null;}
 if(key==='A/T'&&Number(st.TO)>0)return Number(st.AST)/Number(st.TO);
 n=Number(String(st[key]??'').replace(/[,*]/g,''));return st[key]!=null&&st[key]!==''&&Number.isFinite(n)?n:null;
}
function fmt(n,key){if(n==null)return '—';if(key==='FG%'||key==='FT%')return (n*100).toFixed(2)+'%';if(key==='A/T')return n.toFixed(3);return Number.isInteger(n)?String(n):n.toFixed(1)}
function signed(n){return n==null?'—':(n>0?'+':'')+n.toFixed(1)}
function result(left,right){const {a}=context();const m=a.matchups.find(m=>m.left===left&&m.right===right||m.left===right&&m.right===left);if(!m)return null;return m.left===left?m:{left,right,won:m.lost,lost:m.won,tied:m.tied}}
function actualOpponent(id){return context().s.leaguePower.matchupPairs.find(p=>p.includes(id))?.find(t=>t!==id)}
function score(m){return m?`${m.won.length}:${m.lost.length}:${m.tied.length}`:'—'}
function place(row,key){const ranks=context().a.rows.map(r=>r.ranks[key]);const x=row.ranks[key];if(x==null)return null;return {rank:1+ranks.filter(v=>v<x).length,tied:ranks.filter(v=>v===x).length>1}}
function teamButton(id){return `<button class="team-btn" data-team="${esc(id)}">${esc(context().teams[id].name)}</button>`}
function sortValue(row,key){const c=context(),l=c.luck[row.id];if(key==='name')return c.teams[row.id].name;if(key==='GP')return value(c.teams[row.id],'GP');if(key.startsWith('stat:'))return value(c.teams[row.id],key.slice(5));if(key==='difference')return l.difference;if(key==='median')return l.median;if(key==='actual')return l.actual;if(key==='narrowWins'||key==='narrowLosses')return l[key].length;if(key==='opponentDifference')return l.opponentDifference;return row[key]}
function filteredRows(){const {a,teams}=context();return [...a.rows].filter(r=>teams[r.id].name.toLocaleLowerCase().includes(state.query.toLocaleLowerCase())).sort((a,b)=>{const x=sortValue(a,state.sort),y=sortValue(b,state.sort);if(x==null&&y==null)return a.rank-b.rank;if(x==null)return 1;if(y==null)return -1;return (typeof x==='string'?x.localeCompare(y,'zh-CN'):x-y)*state.direction||a.rank-b.rank})}
function heading(key,title){const sorted=state.sort===key;return `<th class="${sorted?'sorted':''}" scope="col" aria-sort="${sorted?(state.direction===1?'ascending':'descending'):'none'}"><button data-sort="${key}">${esc(title)}${sorted?(state.direction===1?' ↑':' ↓'):' ↕'}</button></th>`}
function table(headers,body,cls=''){return `<div class="table-wrap"><table class="${cls}"><thead><tr>${headers}</tr></thead><tbody>${body||`<tr><td colspan="20"><div class="empty">没有匹配的球队</div></td></tr>`}</tbody></table></div>`}
function render(){const {s,a}=context();applyTheme();$('title').textContent=`${s.league} · ${s.week}`;const stamp=new Date(s.leaguePower.updatedAt).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});$('meta').textContent=`全盟数据快照 · 截至 ${stamp}（北京时间）`;
 $('weeks').innerHTML=REPORT.leagues.filter(d=>d.snapshot.leagueID===state.league).map(d=>`<option value="${esc(d.snapshot.week)}" ${d.snapshot.week===state.week?'selected':''}>${esc(d.snapshot.week)}</option>`).join('');
 $('leagues').innerHTML=[...new Map(REPORT.leagues.map(d=>[d.snapshot.leagueID,d])).values()].map(d=>`<button class="${state.league===d.snapshot.leagueID?'active':''}" aria-pressed="${state.league===d.snapshot.leagueID}" data-league="${d.snapshot.leagueID}">${esc(d.snapshot.league)}</button>`).join('');
 $('nav').innerHTML=VIEWS.map(([k,n])=>`<button class="${state.view===k?'active':''}" aria-current="${state.view===k?'page':'false'}" data-view="${k}">${n}</button>`).join('');
 $('chips').innerHTML=`<span class="chip"><b>${a.rows.length}</b>球队</span><span class="chip"><b>${s.columns.length}</b>计分项目</span><span class="chip"><b>${s.leaguePower.matchupPairs.length}</b>实际对局</span><span class="chip"><b>${a.matchups.length}</b>两两比较</span><span class="chip"><b>${a.rows.length*s.columns.length}</b>战力满分</span>`;
 $('view-title').textContent=VIEWS.find(v=>v[0]===state.view)[1];$('view-note').textContent={overview:'点击表头按数字或名称排序；点击球队查看全部对战。',stats:'按累计数据的完整精度排序，GP 不计入战力；失误越少越好。',actual:'真实配对，点击查看逐项数据与险胜明细。',matrix:'按行球队视角比较，可点击任意格子查看 各项详情。',luck:'区分该周配对影响与单项数据接近；不把走位差等同于全部运气。'}[state.view];
 $('ranks-control').hidden=state.view!=='stats';$('matrix-sort').hidden=state.view!=='matrix';$('reset').hidden=state.view==='actual'||state.view==='matrix';
 ({overview:renderOverview,stats:renderStats,actual:renderActual,matrix:renderMatrix,luck:renderLuck})[state.view]();
}
function renderOverview(){const c=context(),rows=filteredRows();csvRows=[['球队','战力名次','战力积分','GP','全对战胜','全对战负','全对战平','该周对手','实际比分 胜:负:平']];
 const body=rows.map(row=>{const t=c.teams[row.id],opp=actualOpponent(row.id),m=result(row.id,opp);csvRows.push([t.name,row.rank,row.points,value(t,'GP'),row.wins,row.losses,row.ties,(c.teams[opp]?.name||'尚未获取'),score(m)]);return `<tr><td>${teamButton(row.id)}</td><td>${row.rank}</td><td><b>${fmt(row.points)}</b></td><td>${fmt(value(t,'GP'))}</td><td>${row.wins}</td><td>${row.losses}</td><td>${row.ties}</td><td>${esc((c.teams[opp]?.name||'尚未获取'))}</td><td><button class="btn small" data-match="${row.id},${opp}">${score(m)}</button></td></tr>`}).join('');
 const headers=heading('name','球队')+heading('rank','战力名次')+heading('points','战力积分')+heading('GP','GP')+heading('wins','全对战胜')+heading('losses','负')+heading('ties','平')+'<th>该周对手</th><th>实际比分 胜:负:平</th>';
 $('content').innerHTML=table(headers,body)+`<div class="grid section"><section class="panel"><h3>全盟战力积分</h3><div class="note">每项第一 ${c.a.rows.length} 分，依次递减，并列平分。满分 ${c.a.rows.length*c.s.columns.length}。</div><div class="bar-list">${[...c.a.rows].sort((a,b)=>b.points-a.points).map(row=>`<button class="bar-row" data-team="${row.id}"><span class="bar-rank">${row.rank}</span><span class="bar-name">${esc(c.teams[row.id].name)}</span><span class="bar-track"><span class="bar-fill" style="width:${row.points/(c.a.rows.length*c.s.columns.length)*100}%"></span></span><span class="bar-score">${fmt(row.points)}</span></button>`).join('')}</div></section><section class="panel"><h3>该周实际赛果</h3><p class="note">比分依次为胜项 : 负项 : 平项</p><div class="cards">${matchCards()}</div></section></div>`;
}
function renderStats(){const c=context(),rows=filteredRows();csvRows=[['球队','战力积分','GP',...c.s.columns.flatMap(k=>[LABEL[k],LABEL[k]+'名次'])]];
 const body=rows.map(row=>{const t=c.teams[row.id],values=[t.name,row.points,value(t,'GP')];const cells=c.s.columns.map(k=>{const p=place(row,k),n=value(t,k);values.push(n,p?.rank??'');return `<td>${fmt(n,k)}${state.ranks?`<small>${p?(p.tied?'并列第':'第')+p.rank+'名':'暂无排名'}</small>`:''}</td>`}).join('');csvRows.push(values);return `<tr><td>${teamButton(row.id)}</td><td>${fmt(row.points)}</td><td>${fmt(value(t,'GP'))}</td>${cells}</tr>`}).join('');
 $('content').innerHTML=table(heading('name','球队')+heading('points','战力积分')+heading('GP','GP')+c.s.columns.map(k=>heading('stat:'+k,LABEL[k])).join(''),body)+`<p class="table-note">命中率用累计命中／出手计算，助失比用累计助攻／失误计算，排名不使用经过舍入的显示值。点击球队可查看累计分子和分母。</p>`;
}
function matchCards(){const c=context();return c.s.leaguePower.matchupPairs.filter(pair=>pair.some(id=>c.teams[id].name.toLocaleLowerCase().includes(state.query.toLocaleLowerCase()))).map(([l,r])=>{const m=result(l,r);return `<button class="match" data-match="${l},${r}"><span class="names">${esc(c.teams[l].name)}<br>vs ${esc(c.teams[r].name)}</span><span class="score">${score(m)}</span><span class="note">GP ${value(c.teams[l],'GP')} : ${value(c.teams[r],'GP')}　查看详情 →</span></button>`}).join('')||'<div class="empty">没有匹配的对局</div>'}
function renderActual(){const c=context();csvRows=[['左队','右队','左胜','左负','平项','左队GP','右队GP']];for(const [l,r]of c.s.leaguePower.matchupPairs){if(![l,r].some(id=>c.teams[id].name.toLocaleLowerCase().includes(state.query.toLocaleLowerCase())))continue;const m=result(l,r);csvRows.push([c.teams[l].name,c.teams[r].name,m.won.length,m.lost.length,m.tied.length,value(c.teams[l],'GP'),value(c.teams[r],'GP')]);}$('content').innerHTML=`<div class="cards">${matchCards()}</div><p class="table-note">真实配对取自 Yahoo 该周赛程。两两比较的虚拟对战不算实际赛果。</p>`}
function matrixOrder(){const c=context();return [...c.a.rows].sort((a,b)=>state.matrixSort==='name'?c.teams[a.id].name.localeCompare(c.teams[b.id].name,'zh-CN'):state.matrixSort==='gp'?value(c.teams[b.id],'GP')-value(c.teams[a.id],'GP'):state.matrixSort==='allplay'?b.wins-a.wins||a.losses-b.losses:a.rank-b.rank)}
function renderMatrix(){const c=context(),all=matrixOrder(),shown=all.filter(r=>c.teams[r.id].name.toLocaleLowerCase().includes(state.query.toLocaleLowerCase()));csvRows=[['行球队 / 列球队',...all.map(r=>c.teams[r.id].name)]];const body=shown.map(row=>{const exported=[c.teams[row.id].name];const cells=all.map(other=>{if(other.id===row.id){exported.push('—');return '<td><div class="self">—</div></td>';}const m=result(row.id,other.id);exported.push(score(m));return `<td><button class="cell ${m.won.length>m.lost.length?'win':m.won.length<m.lost.length?'loss':'tie'}" data-match="${row.id},${other.id}" aria-label="${esc(c.teams[row.id].name+' 对 '+c.teams[other.id].name+' '+score(m))}">${m.won.length}:${m.lost.length}<small>${m.tied.length} 平</small></button></td>`}).join('');csvRows.push(exported);return `<tr><td>${teamButton(row.id)}</td>${cells}</tr>`}).join('');
 $('content').innerHTML=`<div class="legend" style="margin-bottom:12px"><span><i class="swatch win-bg"></i>行球队胜</span><span><i class="swatch loss-bg"></i>行球队负</span><span><i class="swatch tie-bg"></i>平局</span><span>文字统一深色；横向滚动查看所有球队，名称列固定。</span></div>`+table('<th>行球队 / 列球队</th>'+all.map(r=>`<th>${esc(c.teams[r.id].name)}</th>`).join(''),body,'matrix');
}
function renderLuck(){const c=context(),rows=filteredRows();csvRows=[['球队','实际对手','实际分类得分','分类分中位数','走位差','险胜项数','险负项数','对手状态','对手战力偏差']];const body=rows.map(row=>{const l=c.luck[row.id],opp=actualOpponent(row.id),wins=l.narrowWins.map(k=>LABEL[k]).join('、')||'无',loss=l.narrowLosses.map(k=>LABEL[k]).join('、')||'无';csvRows.push([c.teams[row.id].name,(c.teams[opp]?.name||'尚未获取'),l.actual,l.median,l.difference,l.narrowWins.length,l.narrowLosses.length,l.opponentForm,l.opponentDifference??'']);return `<tr><td>${teamButton(row.id)}</td><td>${esc((c.teams[opp]?.name||'尚未获取'))}</td><td>${fmt(l.actual)}</td><td>${fmt(l.median)}</td><td class="${l.difference>0?'pos':l.difference<0?'neg':''}"><b>${signed(l.difference)}</b></td><td>${l.narrowWins.length}<small>${esc(wins)}</small></td><td>${l.narrowLosses.length}<small>${esc(loss)}</small></td><td>${esc(l.opponentForm)}${l.opponentDifference!=null?`<small>${signed(l.opponentDifference)} 战力分</small>`:''}</td><td><button class="btn small" data-match="${row.id},${opp}">逐项查看</button></td></tr>`}).join('');$('content').innerHTML=table(heading('name','球队')+'<th>实际对手</th>'+heading('actual','实际分类得分')+heading('median','分类分中位数')+heading('difference','走位差')+heading('narrowWins','险胜项数')+heading('narrowLosses','险负项数')+heading('opponentDifference','对手状态')+'<th>明细</th>',body)+`<p class="table-note">走位差 = 实际分类得分 − 与其余所有球队比较的分类得分中位数。正值为配对相对有利。对手爆种／失常看其该周战力与自己此前最多 4 周均分的差值，至少需 2 个可比历史周；第一周显示样本不足。</p>`}
function openDialog(title,note,content){$('dialog-title').textContent=title;$('dialog-note').textContent=note;$('dialog-content').innerHTML=content;$('detail').showModal()}
function matchDetail(left,right){const c=context(),m=result(left,right);if(!m)return;const t=c.teams[left],other=c.teams[right],isActual=actualOpponent(left)===right;const narrowW=c.luck[left]?.narrowWins||[],narrowL=c.luck[left]?.narrowLosses||[];
 const body=c.s.columns.map(k=>{const x=value(t,k),y=value(other,k),gap=x==null||y==null?null:x-y,percentage=k==='FG%'||k==='FT%',win=m.won.includes(k),tie=m.tied.includes(k);const close=!tie&&k!=='A/T'&&gap!=null&&Math.abs(gap)<=(percentage?.01+1e-10:1);return `<tr><td>${LABEL[k]}</td><td>${fmt(x,k)}${k==='FG%'?`<small>${esc(t.stats['FGM/A'])}</small>`:k==='FT%'?`<small>${esc(t.stats['FTM/A'])}</small>`:''}</td><td>${fmt(y,k)}${k==='FG%'?`<small>${esc(other.stats['FGM/A'])}</small>`:k==='FT%'?`<small>${esc(other.stats['FTM/A'])}</small>`:''}</td><td>${gap==null?'—':(gap>0?'+':'')+(percentage?(gap*100).toFixed(3)+' 个百分点':k==='A/T'?gap.toFixed(3):gap)}</td><td>${tie?'平':win?'左队胜':'右队胜'}</td><td>${close?`<span class="badge">${win?'左队险胜':'右队险胜'}</span>`:'—'}</td></tr>`}).join('');
 openDialog(`${t.name} vs ${other.name}`,`${isActual?'该周真实配对':'两两数据比较，非实际配对'} · ${c.s.week}`,`<div class="dialog-score">${score(m)} <span class="note">胜项 : 负项 : 平项</span></div><p class="note">GP ${value(t,'GP')} : ${value(other,'GP')}。以下差值为左队减右队；失误越少越好。</p>`+table('<th>项目</th><th>左队</th><th>右队</th><th>差值</th><th>该项结果</th><th>接近情况</th>',body)+`<p class="note">单项险胜：计数差 1，投篮／罚球命中率差不超过 1 个百分点。平项、助失比不套用此规则。</p>`);
}
function teamDetail(id){const c=context(),t=c.teams[id],row=c.rows[id],op=actualOpponent(id),l=c.luck[id];const opponents=c.a.rows.filter(r=>r.id!==id).sort((a,b)=>a.rank-b.rank);const body=opponents.map(r=>{const m=result(id,r.id);return `<tr><td>${esc(c.teams[r.id].name)}${r.id===op?' <span class="badge">实际对手</span>':''}</td><td>${r.rank}</td><td>${fmt(r.points)}</td><td><button class="btn small" data-match="${id},${r.id}">${score(m)}</button></td></tr>`}).join('');openDialog(t.name,`${c.s.week} · 点击比分查看对应各项数据`, `<div class="detail-grid"><div><h3>战力第 ${row.rank} 名 · ${fmt(row.points)} 分</h3><p>GP ${value(t,'GP')}，全对战 ${row.wins} 胜 ${row.losses} 负 ${row.ties} 平</p><p>投篮 ${esc(t.stats['FGM/A'])} · 罚球 ${esc(t.stats['FTM/A'])}</p></div><div><h3>实际对手：${esc((c.teams[op]?.name||'尚未获取'))}</h3><p>实际比分 ${score(result(id,op))} · 走位差 ${signed(l.difference)}</p><p>${esc(l.opponentForm)}${l.opponentDifference!=null?' · '+signed(l.opponentDifference)+' 战力分':''}</p></div></div>`+table('<th>其他球队</th><th>战力名次</th><th>积分</th><th>对战 胜:负:平</th>',body));}
function rules(){const c=context();openDialog('计算规则与数据来源',`${c.s.league} · ${c.s.week}`,`<div class="rules"><p><b>战力积分</b>：${c.s.columns.length} 项分别排名，第一 ${c.a.rows.length} 分、最后 1 分，并列平分所占名次积分。各项相加，最高 ${c.a.rows.length*c.s.columns.length} 分；GP 不计分。它不是 Yahoo 官方积分榜。</p><p><b>全对战</b>：每队与其余所有球队逐项比较，胜项多于负项即为对局胜；TO 越少越好，其余越多越好。</p><p><b>比例</b>：投篮、罚球按累计命中／出手计算；助失比按累计助攻／失误计算。零分母与缺失数据不当作 0。</p><p><b>走位差</b>：实际对局分类得分减去全对战分类得分的中位数。分类赢 1 分、平 0.5 分。它只表示对手配对影响，不解释伤病、比赛场次等全部运气。</p><p><b>险胜</b>：单项计数只差 1；命中率差不超过 1 个百分点。按完整精度判断，平项与助失比不套用。</p><p><b>爆种／失常</b>：对手该周战力分减去其自身此前最多 4 个完整周的平均分，至少需要 2 个可比历史周。</p><p><b>导出 CSV</b>：导出当前联盟、当前视图及搜索范围的数据。排序与屏幕一致；命中率保存为小数，避免损失精度。</p><p><b>来源</b>：<a style="color:var(--accent)" href="${esc(c.s.source)}" target="_blank" rel="noopener noreferrer">Yahoo ${esc(c.s.league)} ${esc(c.s.week)} 累计统计</a>。当前 HTML 是离线快照，不会自动从网页拉取数据。</p></div>`)}
function changeView(view){state.view=view;state.sort='rank';state.direction=1;state.query='';$('search').value='';render()}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.league){state.league=b.dataset.league;if(!REPORT.leagues.some(d=>d.snapshot.leagueID===state.league&&d.snapshot.week===state.week))state.week=REPORT.leagues.find(d=>d.snapshot.leagueID===state.league).snapshot.week;$('theme-status').textContent='';state.query='';$('search').value='';state.sort='rank';state.direction=1;render();}else if(b.dataset.view)changeView(b.dataset.view);else if(b.dataset.sort){const key=b.dataset.sort;if(state.sort===key)state.direction*=-1;else {state.sort=key;state.direction=key==='name'||key==='rank'||key==='stat:TO'?1:-1;}render();}else if(b.dataset.match){if($('detail').open)$('detail').close();matchDetail(...b.dataset.match.split(','));}else if(b.dataset.team){if($('detail').open)$('detail').close();teamDetail(b.dataset.team);}});
$('weeks').addEventListener('change',e=>{state.week=e.target.value;state.query='';state.sort='rank';state.direction=1;$('search').value='';if($('detail').open)$('detail').close();render()});
$('appearance').addEventListener('change',e=>saveAppearance(e.target.value,$('bg-color').value));$('bg-color').addEventListener('input',e=>saveAppearance('custom',e.target.value));
$('search').addEventListener('input',e=>{state.query=e.target.value;render()});$('ranks').addEventListener('change',e=>{state.ranks=e.target.checked;render()});$('matrix-sort').addEventListener('change',e=>{state.matrixSort=e.target.value;render()});$('reset').addEventListener('click',()=>{state.sort='rank';state.direction=1;render()});$('close-dialog').addEventListener('click',()=>$('detail').close());$('detail').addEventListener('click',e=>{if(e.target===$('detail'))$('detail').close()});$('rules').addEventListener('click',rules);
$('csv').addEventListener('click',()=>{const safe=v=>{let t=String(v??'');if(/^[=+@\t\r]/.test(t)||/^-[^0-9.]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'};const blob=new Blob(['\ufeff'+csvRows.map(row=>row.map(safe).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${context().s.league}_${context().s.week}_${state.view}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
render();
</script>
</body></html>
